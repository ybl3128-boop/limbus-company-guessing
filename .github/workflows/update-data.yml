name: Update identity data

on:
  schedule:
    # Every Friday at 04:00 KST (Thursday 19:00 UTC)
    - cron: "0 19 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update wiki data and puzzles
        run: npm run update:data

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/identities.json data/puzzles.json; then
            echo "No data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/identities.json data/puzzles.json
          git commit -m "Update identity data"
          git push
